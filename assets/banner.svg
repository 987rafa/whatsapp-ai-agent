<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="whatsapp-ai-agent — self-hosted AI for your WhatsApp">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b141a"/>
      <stop offset="1" stop-color="#101f27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25d366"/>
      <stop offset="1" stop-color="#53bdeb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#25d366" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#25d366" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <circle cx="1190" cy="52" r="150" fill="#25d366" opacity="0.06"/>
  <circle cx="1230" cy="350" r="100" fill="#53bdeb" opacity="0.05"/>

  <!-- Phone with chat bubbles -->
  <g transform="translate(96, 78)">
    <rect x="0" y="0" width="212" height="244" rx="26" fill="#0e1b22" stroke="#25d366" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="28" y="40" width="132" height="36" rx="12" fill="#1f2c33"/>
    <text x="46" y="64" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#d1d7db">Hola 👋</text>
    <rect x="54" y="92" width="132" height="36" rx="12" fill="#075e54"/>
    <text x="72" y="116" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#e9edef">!calc 12*8</text>
    <rect x="28" y="144" width="132" height="36" rx="12" fill="#1f2c33"/>
    <text x="46" y="168" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#d1d7db">96 ✅</text>
    <circle cx="60" cy="206" r="4" fill="#8696a0"/>
    <circle cx="76" cy="206" r="4" fill="#8696a0" opacity="0.7"/>
    <circle cx="92" cy="206" r="4" fill="#8696a0" opacity="0.4"/>
  </g>

  <!-- Title -->
  <text x="392" y="164" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#e9edef">whatsapp-ai-agent</text>
  <rect x="396" y="184" width="232" height="6" rx="3" fill="url(#accent)"/>

  <text x="392" y="238" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="25" fill="#aebac1">Self-hosted AI for your WhatsApp</text>
  <text x="392" y="276" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#8696a0">Gemini · OpenAI · Ollama — memory, images, plugins</text>

  <!-- Chips -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16">
    <rect x="392" y="306" width="196" height="34" rx="17" fill="#0e1b22" stroke="#25d366" stroke-opacity="0.35"/>
    <text x="412" y="328" fill="#25d366">🟢 Free tier ready</text>
    <rect x="608" y="306" width="140" height="34" rx="17" fill="#0e1b22" stroke="#53bdeb" stroke-opacity="0.35"/>
    <text x="628" y="328" fill="#53bdeb">🐳 Docker</text>
    <rect x="768" y="306" width="178" height="34" rx="17" fill="#0e1b22" stroke="#8696a0" stroke-opacity="0.35"/>
    <text x="788" y="328" fill="#e9edef">⚡ Node.js 22+</text>
  </g>
</svg>
