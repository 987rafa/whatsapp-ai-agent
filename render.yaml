# Render Blueprint — one-click deploy
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: whatsapp-ai-agent
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: DATA_DIR
        value: /data
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
